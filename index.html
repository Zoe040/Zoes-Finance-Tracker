<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<title>Zoes Finanzen</title>
<meta name="description" content="Persönlicher Finanz-Überblick: Umsätze, Budgets, Verträge, Prognose. Daten bleiben auf dem Gerät.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --line:#e1e6ee; --line-2:#cdd5e0;
  --text:#14212f; --text-2:#4c5b6c; --text-3:#7a8797;
  --brand:#0066b3; --brand-2:#004f8c; --brand-ink:#ffffff; --brand-soft:#e3effa;
  --accent:#ff6600; --accent-soft:#fff0e5; --accent-ink:#b84a00;
  --pos:#1f7a4d; --pos-soft:#e5f4ec; --neg:#c62f2f; --neg-soft:#fdeceb; --warn:#b26a00; --warn-soft:#fff4dc;
  --hero-1:#0066b3; --hero-2:#00487f;
  --r:16px; --r-s:10px; --shadow:0 1px 2px rgba(20,33,47,.06),0 4px 14px rgba(20,33,47,.06);
  --font:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Barlow',var(--font);
  --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
:root[data-accent="gruen"]{--brand:#1b7a55;--brand-2:#125b3f;--brand-soft:#e2f2ea;--hero-1:#1b7a55;--hero-2:#0f5139}
:root[data-accent="lila"]{--brand:#5b3fa8;--brand-2:#432d80;--brand-soft:#ece7f8;--hero-1:#5b3fa8;--hero-2:#3a2672}
:root[data-accent="petrol"]{--brand:#0b6f7a;--brand-2:#08525a;--brand-soft:#e0f1f2;--hero-1:#0b6f7a;--hero-2:#06474e}
:root[data-accent="beere"]{--brand:#a3245b;--brand-2:#7c1a44;--brand-soft:#f8e5ee;--hero-1:#a3245b;--hero-2:#6d143a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1420; --surface:#122133; --surface-2:#18293d; --line:#22364d; --line-2:#2f4661;
  --text:#e8eef5; --text-2:#a9b8c9; --text-3:#7d8ea3;
  --brand:#3d9be0; --brand-2:#69b3ea; --brand-soft:#15314c; --accent:#ff8a3d; --accent-soft:#3a2414; --accent-ink:#ffb27f;
  --pos:#4cc38a; --pos-soft:#123526; --neg:#ff7a72; --neg-soft:#3b1a1a; --warn:#f0b54d; --warn-soft:#382a10;
  --hero-1:#0d4f86; --hero-2:#0a355b; --shadow:0 1px 2px rgba(0,0,0,.3); --brand-ink:#04213a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1420; --surface:#122133; --surface-2:#18293d; --line:#22364d; --line-2:#2f4661;
  --text:#e8eef5; --text-2:#a9b8c9; --text-3:#7d8ea3;
  --brand:#3d9be0; --brand-2:#69b3ea; --brand-soft:#15314c; --accent:#ff8a3d; --accent-soft:#3a2414; --accent-ink:#ffb27f;
  --pos:#4cc38a; --pos-soft:#123526; --neg:#ff7a72; --neg-soft:#3b1a1a; --warn:#f0b54d; --warn-soft:#382a10;
  --hero-1:#0d4f86; --hero-2:#0a355b; --shadow:0 1px 2px rgba(0,0,0,.3); --brand-ink:#04213a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.num,.amt{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.005em}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
.muted{color:var(--text-2)} .faint{color:var(--text-3)} .small{font-size:.875rem} .tiny{font-size:.78rem}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.hide-amounts .amt{filter:blur(7px);user-select:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout */
#app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:8px;min-height:56px}
.top h1{flex:1;font-size:1.35rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:760px;margin:0 auto;padding:4px 16px 0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b);height:calc(var(--nav-h) + var(--safe-b))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:.72rem;font-weight:600;letter-spacing:.01em;position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--brand)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.nav .badge{position:absolute;top:8px;left:calc(50% + 6px)}
@media (min-width:900px){
  .nav{display:none}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px}
  .side .brandmark{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-family:var(--display);font-weight:700;font-size:1.15rem}
  .side button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--text-2);font-weight:600;text-align:left;position:relative}
  .side button svg{width:22px;height:22px}
  .side button:hover{background:var(--surface-2)}
  .side button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
  .side .badge{margin-left:auto}
  .main{padding-bottom:40px}
  .fab{bottom:28px!important;right:32px!important}
}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--hero-1),var(--hero-2));display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:18px;height:18px}

/* Buttons */
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--text-2);position:relative;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn .badge{position:absolute;top:4px;right:3px}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:.7rem;font-weight:700;display:inline-grid;place-items:center;line-height:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px;background:var(--surface-2);color:var(--text);transition:background .15s,transform .05s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2)}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line-2)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.small{min-height:34px;padding:6px 12px;font-size:.875rem;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:4px 0}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns>.btn{flex:1}

/* Cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-h h2{flex:1;font-size:1.02rem}
.card-h .link{font-size:.9rem}
.section-t{font-family:var(--display);font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:20px 4px 8px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}.grid2>.card{margin-bottom:0}}
.tiles{display:grid;grid-template-columns:1fr;gap:12px}
.tiles>.card{margin:0}
@media (min-width:640px){.tiles{grid-template-columns:1fr 1fr}.tiles>.wide{grid-column:1/-1}}

/* Hero */
.hero{background:linear-gradient(140deg,var(--hero-1),var(--hero-2));color:#fff;border-radius:20px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.hero .lbl{font-size:.9rem;opacity:.85;font-weight:600;display:flex;align-items:center;gap:6px}
.hero .big{font-family:var(--display);font-size:2.6rem;font-weight:700;line-height:1.05;margin:6px 0 4px;letter-spacing:-.01em}
.hero .sub{opacity:.88;font-size:.95rem}
.hero .pill{background:rgba(255,255,255,.16);color:#fff}
.hero .hero-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hero .hero-row button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem}
.hero .hero-row button:hover{background:rgba(255,255,255,.24)}
.hero .accent-bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.breakdown{margin-top:14px;border-top:1px solid rgba(255,255,255,.2);padding-top:10px;font-size:.92rem}
.breakdown .li{display:flex;justify-content:space-between;padding:3px 0;opacity:.95}
.breakdown .li.total{font-weight:700;border-top:1px solid rgba(255,255,255,.25);margin-top:4px;padding-top:6px}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:52px}
.list>.li+.li{border-top:1px solid var(--line)}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:1.15rem;flex:none;background:var(--surface-2)}
.li .mid{flex:1;min-width:0}
.li .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{font-size:.84rem;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .end{text-align:right;flex:none}
.li .end .t2{text-align:right}
button.li{border:0;background:none;width:100%;text-align:left;padding-left:0;padding-right:0}
button.li:hover .t1{color:var(--brand)}
.li .chev{color:var(--text-3);width:18px;height:18px;flex:none}
.day-h{display:flex;justify-content:space-between;font-size:.8rem;font-weight:600;color:var(--text-3);padding:16px 2px 4px;text-transform:uppercase;letter-spacing:.04em}
.tx-card{padding:4px 14px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:600;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill.pos{background:var(--pos-soft);color:var(--pos)}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;color:var(--text-2);padding:28px 12px}
.empty .e-ic{font-size:2rem;margin-bottom:6px}

/* Progress */
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--brand)}
.bar>i.c{background:color-mix(in srgb,var(--brand) 40%,transparent)}
.bar.over>i{background:var(--neg)}
.bar.near>i{background:var(--warn)}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text-3);border-radius:1px}
.bud{padding:12px 0}
.bud+.bud{border-top:1px solid var(--line)}
.bud .top-l{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bud .top-l .mid{flex:1;min-width:0}
button.bud{display:block;width:100%;border:0;background:none;text-align:left;padding-left:0;padding-right:0}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.lbl-s{font-size:.84rem;font-weight:600;color:var(--text-2)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:46px;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.input{min-height:80px;resize:vertical}
.inrow{display:flex;gap:8px;align-items:center}
.inrow>*{flex:1;min-width:0}
.inrow>.fix{flex:none}
.money-in{font-family:var(--display);font-size:2.2rem;font-weight:700;text-align:center;border:0;background:transparent;width:100%;outline:none;padding:6px 0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;min-height:52px}
.switch+.switch{border-top:1px solid var(--line)}
.switch .mid{flex:1}
.tog{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line-2);position:relative;flex:none;transition:background .2s;cursor:pointer;margin:0}
.tog::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog:checked{background:var(--brand)}
.tog:checked::after{transform:translateX(20px)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.88rem;color:var(--text-2);min-height:36px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.86rem;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.add{border-style:dashed;color:var(--text-2)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.catgrid button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;font-weight:600;color:var(--text-2);min-height:72px;text-align:center;line-height:1.2}
.catgrid button .e{font-size:1.35rem}
.catgrid button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-3)}
.search .input{padding-left:38px}

/* Period switch */
.pswitch{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow);margin-bottom:12px}
.pswitch .mid{flex:1;text-align:center}
.pswitch .mid b{display:block;font-family:var(--display);font-size:1.02rem}
.pswitch .mid span{font-size:.78rem;color:var(--text-3)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,32,.45);z-index:60;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
.sheet.on{transform:none}
@media (min-width:720px){.sheet{left:50%;right:auto;width:600px;bottom:auto;top:50%;border-radius:20px;transform:translate(-50%,-46%);opacity:0;transition:opacity .2s,transform .2s;max-height:88vh}.sheet.on{transform:translate(-50%,-50%);opacity:1}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 12px 8px 20px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;font-size:1.12rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{overflow-y:auto;padding:16px 20px 20px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:8px auto 0}
@media (min-width:720px){.grab{display:none}}

/* FAB / Toast */
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:25;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(255,102,0,.35);display:grid;place-items:center}
.fab svg{width:28px;height:28px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 90px);transform:translateX(-50%) translateY(20px);background:#14212f;color:#fff;padding:12px 16px;border-radius:12px;z-index:80;opacity:0;transition:all .2s;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.94rem}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast button{border:0;background:none;color:#7cc0ff;font-weight:700;padding:4px}

/* Notices */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);margin-bottom:8px}
.note.warn{background:var(--warn-soft)}
.note.ok{background:var(--pos-soft)}
.note .n-ic{font-size:1.1rem;line-height:1.3}
.note .mid{flex:1;font-size:.94rem}
.note .x{border:0;background:none;color:var(--text-3);padding:2px 4px;font-size:1.1rem}
button.note{border:0;width:100%;text-align:left}

/* Charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--text-3)}
.chart .axis{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--text-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.donut-wrap{display:flex;gap:18px;align-items:center}
.donut-wrap svg{flex:none}
.donut-c{font-family:var(--display);font-weight:700}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:.72rem;font-weight:700;color:var(--text-3);padding:4px 0}
.cal button{border:0;background:var(--surface-2);border-radius:10px;min-height:52px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85rem;font-weight:600}
.cal button.out{opacity:.35}
.cal button.today{box-shadow:0 0 0 2px var(--brand) inset}
.cal button[aria-pressed="true"]{background:var(--brand);color:#fff}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--neg)}
.cal .dots i.in{background:var(--pos)}
.cal .dots i.exp{opacity:.45}

/* Review */

<script>
/* Zoes Finanzen – Rechenkern. Reine Logik ohne DOM, in Node testbar.
   Beträge sind ganze Cent, Datumswerte 'YYYY-MM-DD'. */
(function (root) {
'use strict';
const C = {};

/* ---------- Datum ---------- */
C.today = () => { const d = new Date(); return iso(d.getFullYear(), d.getMonth() + 1, d.getDate()); };
function pad(n) { return String(n).padStart(2, '0'); }
function iso(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
C.iso = iso;
function parts(s) { return [+s.slice(0, 4), +s.slice(5, 7), +s.slice(8, 10)]; }
C.parts = parts;
function dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
C.dim = dim;
function toUTC(s) { const [y, m, d] = parts(s); return Date.UTC(y, m - 1, d); }
C.addDays = (s, n) => { const t = new Date(toUTC(s) + n * 864e5); return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); };
C.diffDays = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 864e5);
C.addMonths = (s, n, day) => {
  let [y, m, d] = parts(s); m += n;
  while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; }
  const dd = Math.min(day || d, dim(y, m));
  return iso(y, m, dd);
};
C.weekday = s => new Date(toUTC(s)).getUTCDay(); // 0 = So
C.parseDate = s => {
  s = String(s || '').trim();
  let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return iso(y, +m[2], +m[1]); }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return iso(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return iso(+m[3], +m[1], +m[2]);
  return null;
};
const MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const MON3 = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
C.MON = MON; C.MON3 = MON3;
C.fmtDate = (s, style) => {
  if (!s) return '';
  const [y, m, d] = parts(s);
  if (style === 'short') return pad(d) + '.' + pad(m) + '.';
  if (style === 'long') return d + '. ' + MON[m - 1] + ' ' + y;
  if (style === 'month') return MON[m - 1] + ' ' + y;
  if (style === 'mon') return MON3[m - 1] + ' ' + String(y).slice(2);
  return pad(d) + '.' + pad(m) + '.' + y;
};

/* ---------- Geld ---------- */
C.parseAmount = s => {
  s = String(s == null ? '' : s).trim().replace(/\s|€|EUR/g, '');
  if (!s) return 0;
  let neg = false;
  if (/^-/.test(s)) { neg = true; s = s.slice(1); } else if (/-$/.test(s)) { neg = true; s = s.slice(0, -1); } else if (/^\+/.test(s)) s = s.slice(1);
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/\.\d{1,2}$/.test(s)) s = s.replace(/,/g, '');
  else s = s.replace(/[.,]/g, '');
  const v = Math.round(parseFloat(s) * 100);
  if (!isFinite(v)) return 0;
  return neg ? -v : v;
};
C.fmt = (c, opt) => {
  opt = opt || {};
  const neg = c < 0; const a = Math.abs(Math.round(c));
  let e = Math.floor(a / 100), ct = a % 100;
  let s = String(e).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  if (!opt.noCents) s += ',' + pad(ct);
  s += ' €';
  if (neg) return '−' + s;
  if (opt.sign && c > 0) return '+' + s;
  return s;
};
C.fmtPlain = c => { const neg = c < 0; const a = Math.abs(c); return (neg ? '-' : '') + Math.floor(a / 100) + ',' + pad(a % 100); };

/* ---------- Text ---------- */
C.norm = s => String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();
const LEGAL = /\b(gmbh|ag|se|kg|ohg|e\.? ?v|ev|co|s\.?a\.?r\.?l|s\.?c\.?a|sca|b\.?v|bv|n\.?v|nv|ltd|inc|u|und|mbh|eg|e k|ek|oh|o)\b\.?/gi;
function tidyName(s) {
  s = String(s || '').replace(/\s+/g, ' ').trim();
  if (!s) return '';
  s = s.replace(/^(zettle-?\.?|sumup \*|sq \*|izettle\*?|sp )\s*/i, '');
  s = s.replace(/\s+sagt danke\b.*$/i, '');
  s = s.replace(/\s+(gir\s+)?\d{3,}\b.*$/i, '');
  s = s.replace(/\s+(sagt danke|danke)$/i, '');
  s = s.replace(/\s+-\s+eine marke.*$/i, '').replace(/\s+payments?(\s+europe)?$/i, '');
  s = s.replace(/(?:[,.]\s*|\s+)(gmbh|ag|se|kg|ohg|oh|o|e\. ?v\.|mbh|s\.a r\.l\.|s\.a\.r\.l\.|b\.v\.|bv|n\.v\.|ltd\.?|inc\.?|inh\.?)(\s*(\+|&|und|u\.)?\s*(co\.?\s*)?(kg|ohg)?)?\.?\s*$/i, '');
  s = s.replace(/[,.]+$/, '').trim();
  if (s === s.toUpperCase() && /[A-Z]{3}/.test(s)) s = s.toLowerCase().replace(/(^|[\s\-/&])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
  return s;
}
C.tidyName = tidyName;

/* ---------- Kategorien ---------- */
C.GROUPS = { income: 'Einnahmen', fix: 'Fixkosten', flex: 'Flexibel', rare: 'Selten', transfer: 'Umbuchungen' };

C.makeCats = () => C.DEFAULT_CATS.map(([id, name, emoji, color, group]) => ({ id, name, emoji, color, group, budget: 0, rollover: false }));

/* Schlagwörter → Kategorie. Geprüft gegen Händlername und Verwendungszweck. */
C.KEYWORDS = [
  ['umbuchung', []],
  ['gehalt', ['lohn', 'gehalt', 'bezuege', 'verguetung', 'ausbildungsverguetung', 'bafoeg']],
  ['familie', ['unterhalt', 'taschengeld', 'kindergeld']],
  ['erstattung', ['erstattung', 'rueckzahlung', 'gutschrift', 'storno', 'bkk', 'aok', 'krankenkasse', 'barmer', 'techniker krankenkasse', 'finanzamt']],
  ['miete', ['miete', 'mietwohnung', 'nebenkosten', 'hausgeld', 'wohnung']],
  ['energie', ['e on', 'eon', 'stadtwerke', 'strom', 'gas ', 'vattenfall', 'enbw', 'rwe', 'naturstrom', 'lichtblick', 'ovag', 'mainova', 'abschlag']],
  ['handy', ['telekom', 'congstar', 'vodafone', 'o2', 'telefonica', '1&1', '1 1 telecom', 'aldi talk', 'fraenk', 'freenet', 'drillisch', 'klarmobil', 'mobilcom', 'mobilfunk', 'internet']],

];

/* ---------- CSV ---------- */
C.parseCSV = text => {
  text = String(text || '').replace(/^﻿/, '');
  const first = text.split(/\r?\n/).slice(0, 12).join('\n');
  const delim = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length / 2 ? ';' : (first.match(/\t/g) || []).length > 3 ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
};

/* Spaltennamen verschiedener Banken (VR, Sparkasse, ING, DKB, Comdirect, N26 u. a.) */
const COLS = {

};
function mapHeader(h) {
  const n = h.map(x => C.norm(x));
  const m = {};
  for (const k in COLS) {
    for (const alias of COLS[k]) {
      const a = C.norm(alias);
      const i = n.findIndex((x, j) => x === a && !Object.values(m).includes(j));
      if (i >= 0) { m[k] = i; break; }
    }
  }
  if (m.amount == null) {
    for (const alias of COLS.amount) { const i = n.findIndex(x => x.startsWith(C.norm(alias))); if (i >= 0) { m.amount = i; break; } }
  }
  return m;
}

/* Händler aus einer Buchung herauslesen */
const PROV_RE = /paypal|amazon payments|payone|dz bank|sg vr payment|adyen|concardis|worldline|nexi|wirecard|stripe|klarna|unicr w|sumup|zettle/;
const PROVIDERS = { test: n => PROV_RE.test(C.norm(n)) };
C.isProvider = n => PROVIDERS.test(n);
const BRANDS = [['rewe', 'REWE'], ['lidl', 'Lidl'], ['aldi', 'Aldi'], ['penny', 'Penny'], ['netto', 'Netto'], ['kaufland', 'Kaufland'], ['edeka', 'Edeka'], ['tegut', 'tegut'], ['dm drogerie', 'dm'], ['dm markt', 'dm'], ['mueller', 'Müller'], ['rossmann', 'Rossmann'], ['aral', 'Aral'], ['esso', 'Esso'], ['shell', 'Shell'], ['total', 'Total'], ['jet', 'JET'], ['starbucks', 'Starbucks'], ['burger king', 'Burger King'], ['mcdonald', 'McDonald\'s'], ['tedi', 'TEDi'], ['ikea', 'IKEA'], ['h m', 'H&M'], ['primark', 'Primark'], ['zara', 'Zara']];
C.BRANDS = BRANDS;
function brand(m) { const n = C.norm(m); for (const [k, v] of BRANDS) if (n === k || n.startsWith(k + ' ')) return v; return m; }
C.merchantOf = t => {
  const name = t.name || '', p = t.purpose || '', bt = C.norm(t.text);
  let m = '';
  if (/paypal/i.test(name)) {
    const x = p.match(/Ihr Einkauf bei\s+(.*?)\s*(?:EREF:|MREF:|$)/i);
    const y = p.match(/\/\.\s*([^,]+),/) || p.match(/PP\s*\.\s*([^,]+),/);
    const v = (x && x[1].trim()) || (y && y[1].trim()) || '';
    m = v ? tidyName(v) : (t.amount > 0 ? 'PayPal Gutschrift' : 'PayPal-Zahlung');
    return m;
  } else if (/amazon payments|amzn/i.test(name) || /AMZN Mktp/i.test(p)) {
    m = /prime/i.test(p) ? 'Amazon Prime' : 'Amazon';
  } else if (/auszahlung|geldautomat/.test(bt)) {
    return 'Geldautomat';
  } else if (/kartenzahlung|girocard|debit|kreditkarte|visa|mastercard/.test(bt) && p) {
    m = p.split('/')[0].replace(/\s{2,}.*$/, '').replace(/\d{2}\.\d{2}\.\d{4}.*$/, '').trim();
    if (m.length < 2) m = name;
    return brand(tidyName(m)) || 'Unbekannt';
  } else m = name || p.slice(0, 40);
  return brand(tidyName(m)) || 'Unbekannt';
};
C.merchantKey = t => C.norm(t.merchant || C.merchantOf(t)).replace(/\b(gmbh|ag|se|kg|ohg|markt|filiale|sagt danke|danke|paypal)\b/g, '').replace(/\d{3,}/g, '').replace(/\s+/g, ' ').trim().split(' ').slice(0, 3).join(' ');

C.importCSV = (text, opts) => {
  opts = opts || {};
  const rows = C.parseCSV(text);
  let hi = -1, map = null;
  for (let i = 0; i < Math.min(rows.length, 30); i++) {
    const m = mapHeader(rows[i]);
    if (m.date != null && (m.amount != null || (m.debit != null && m.credit != null))) { hi = i; map = m; break; }
  }
  if (hi < 0) throw new Error('In der Datei habe ich keine Spalten für Datum und Betrag gefunden. Ist es der CSV-Export der Umsätze?');
  // IBAN im Vorspann (z. B. ING, DKB)
  let preIban = '';
  for (let i = 0; i < hi; i++) { const j = rows[i].join(' '); const x = j.match(/\b([A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){3,7}(?:\s?[A-Z0-9]{1,4})?)\b/); if (x) { preIban = x[1].replace(/\s/g, ''); break; } }
  const fileIban = (opts.fileName || '').match(/[A-Z]{2}\d{20}/);
  const out = []; const accounts = {};
  const g = (r, k) => (map[k] != null ? String(r[map[k]] == null ? '' : r[map[k]]).trim() : '');
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i];
    const date = C.parseDate(g(r, 'date'));
    if (!date) continue;
    let amount;
    if (map.amount != null) amount = C.parseAmount(g(r, 'amount'));
    else amount = C.parseAmount(g(r, 'credit')) - Math.abs(C.parseAmount(g(r, 'debit')));
    const accIban = (g(r, 'accIban') || preIban || (fileIban ? fileIban[0] : '') || opts.accIban || 'KONTO').replace(/\s/g, '');
    if (!accounts[accIban]) accounts[accIban] = { iban: accIban, name: g(r, 'accName') || opts.accName || 'Girokonto', bank: g(r, 'bank') || opts.bank || '' };
    const t = {
      acc: accIban, date, valuta: C.parseDate(g(r, 'valuta')) || date,
      name: g(r, 'name').replace(/\s+/g, ' '), iban: g(r, 'iban').replace(/\s/g, ''),
      text: g(r, 'text'), purpose: g(r, 'purpose').replace(/\s+/g, ' '),
      amount, cur: g(r, 'cur') || 'EUR',
      saldo: map.saldo != null && g(r, 'saldo') !== '' ? C.parseAmount(g(r, 'saldo')) : null,
      cred: g(r, 'cred'), mandate: g(r, 'mandate')
    };
    // Bei Kartenzahlungen steht in "Mandatsreferenz" nur eine Belegnummer
    if (/karte|girocard|auszahlung|debit/i.test(t.text) || /\b(ELV|OLV)\d{6,}|\bOLV\b/.test(t.purpose + ' ' + t.name)) { t.card = true; t.mandate = ''; t.cred = ''; }
    const da = t.purpose.match(/\/\*DA-(\d+)\*/); if (da) t.da = da[1];
    t.merchant = C.merchantOf(t);
    out.push(t);
  }
  // Fingerabdruck für Dubletten; gleiche Buchungen am selben Tag bekommen eine laufende Nummer
  const seen = {};
  for (const t of out) {
    const base = [t.acc, t.date, t.amount, t.saldo == null ? '' : t.saldo, C.norm(t.name).slice(0, 30), C.norm(t.purpose).slice(0, 60)].join('|');
    seen[base] = (seen[base] || 0) + 1;
    t.key = base + '|' + seen[base];
  }
  return { accounts: Object.values(accounts), txs: out };
};

/* ---------- Zustand ---------- */
C.VERSION = 1;
C.newState = () => ({
  v: C.VERSION, confirmed: {}, accounts: [], tx: [], cats: C.makeCats(), rules: [], recurring: [], goals: [], scenarios: [], reports: [],
  plan: {}, dismissed: {},
  settings: { ownName: '', ownIbans: [], period: { mode: 'day', day: 1 }, flexInForecast: true, lowBalance: 10000, hide: false, theme: 'auto', accent: 'blau', pin: '', cashTracking: false, goalsInFree: true, remindDays: 30, lastBackup: '', onboarded: false },
  meta: { created: C.today(), imports: [] }
});
let uid = 0;
C.id = p => (p || 'x') + Date.now().toString(36) + (uid++).toString(36) + Math.random().toString(36).slice(2, 5);
C.cat = (S, id) => S.cats.find(c => c.id === id) || S.cats.find(c => c.id === 'sonstiges');
C.isOwn = (S, t) => {
  const own = new Set([...S.accounts.map(a => a.iban), ...(S.settings.ownIbans || [])]);
  if (t.iban && own.has(t.iban)) return true;
  if (t.iban && C.sameHolder(t.iban, S.accounts)) return true;
  const on = C.norm(S.settings.ownName);
  if (on && C.norm(t.name) === on && !t.card) return true;
  return false;
};

/* Unterkonto bei derselben Bank: gleiche Bankleitzahl und gleiche Endziffern der Kontonummer (z. B. VR-Sparkonto) */
C.sameHolder = (iban, accounts) => {
  if (!/^DE\d{20}$/.test(iban)) return false;
  return accounts.some(a => /^DE\d{20}$/.test(a.iban) && a.iban !== iban && a.iban.slice(4, 12) === iban.slice(4, 12) && a.iban.slice(-6) === iban.slice(-6));
};
/* Regeln: Bedingungen (UND) → Aktionen */
C.FIELDS = { merchant: 'Händler', name: 'Name', purpose: 'Verwendungszweck', text: 'Buchungsart', iban: 'IBAN', amount: 'Betrag (€)', acc: 'Konto' };
C.OPS = { contains: 'enthält', is: 'ist genau', starts: 'beginnt mit', gt: 'größer als', lt: 'kleiner als' };
C.ruleMatches = (rule, t) => (rule.conds || []).length > 0 && rule.conds.every(c => {
  if (c.field === 'amount') {
    const v = Math.round(parseFloat(String(c.value).replace(',', '.')) * 100);
    if (!isFinite(v)) return false;
    if (c.op === 'gt') return t.amount > v;
    if (c.op === 'lt') return t.amount < v;
    return t.amount === v;
  }
  const a = C.norm(c.field === 'merchant' ? t.merchant : t[c.field]);
  const b = C.norm(c.value);
  if (!b) return false;
  if (c.op === 'is') return a === b;
  if (c.op === 'starts') return a.startsWith(b);
  return (' ' + a + ' ').includes(' ' + b + ' ') || a.includes(b);
});

// C.lastConf: 'sure', wenn die Zuordnung eindeutig ist (Buchungsart oder Händlername), sonst 'guess'
C.lastConf = 'guess';
C.autoCat = (S, t) => {
  const bt = C.norm(t.text);
  C.lastConf = 'sure';
  if (/auszahlung|geldautomat|bargeld/.test(bt) && t.amount < 0) return 'bargeld';
  if (/bezuege|lohn|gehalt/.test(bt) && t.amount > 0) return 'gehalt';
  C.lastConf = 'guess';
  // Zahlungsdienstleister (PayPal, Payone …) sagen nichts über den Händler
  const nm = PROVIDERS.test(t.name) || /\bbank\b/i.test(t.name) ? '' : C.norm(t.name);
  const hayM = ' ' + C.norm(t.merchant) + ' ' + nm + ' ';
  const purp = t.card ? String(t.purpose || '').split('/')[0] : String(t.purpose || '');
  const hay = hayM + C.norm(purp).replace(/\b(eref|mref|cred|iban|bic)\b.*$/, '').slice(0, 140) + ' ';
  // kurze Wörter nur als ganzes Wort, lange auch als Wortanfang (z. B. „versicherg“)
  const has = (h, w) => { const nw = C.norm(w); if (!nw) return false; return nw.length >= 5 && !w.endsWith(' ') ? h.includes(' ' + nw) : h.includes(' ' + nw + ' '); };
  const ok = (cat, pos) => { const c = S.cats.find(x => x.id === cat); if (!c) return false; return pos ? true : c.group !== 'income'; };
  for (const h of [hayM, hay]) {
    for (const [cat, words] of C.KEYWORDS) {
      if (!ok(cat, t.amount > 0)) continue;
      if (words.some(w => has(h, w))) {
        C.lastConf = h === hayM ? 'sure' : 'guess';
        // Geld zurück von einem Händler (z. B. Strom-Guthaben, Mietanteil) mindert die Ausgaben dieser Kategorie
        return cat;
      }
    }
  }
  if (t.amount > 0) {
    if (/paypal/i.test(t.name)) return 'erstattung';
    if (/ueberweis|gutschrift|dauerauftr/.test(bt) && t.name && !/gmbh|\bag\b|bank|se$/i.test(t.name)) return 'familie';
    return 'einnahmen';
  }
  return 'sonstiges';
};

/* Kategorie für eine Buchung bestimmen. Manuell gesetzte bleiben. */
C.classify = (S, t, force) => {
  if (t.catSrc === 'user' && !force) return t;
  let done = false;
  for (const r of S.rules) {
    if (r.off || !C.ruleMatches(r, t)) continue;
    if (r.cat) { t.cat = r.cat; t.catSrc = 'rule'; t.transfer = C.cat(S, r.cat).group === 'transfer'; done = true; }
    if (r.transfer) { t.transfer = true; t.cat = 'umbuchung'; t.catSrc = 'rule'; done = true; }
    if (r.tag) { t.tags = t.tags || []; if (!t.tags.includes(r.tag)) t.tags.push(r.tag); }
    if (r.tax) t.tax = true;
    if (done) break;
  }
  if (done) return t;
  if (C.isOwn(S, t)) { t.transfer = true; t.cat = 'umbuchung'; t.catSrc = 'auto'; return t; }
  if (S.settings.cashTracking && /auszahlung/i.test(t.text) && t.amount < 0 && (!S.settings.cashSince || t.date >= S.settings.cashSince)) { t.transfer = true; t.cashLink = true; t.cat = 'umbuchung'; t.catSrc = 'auto'; return t; }
  t.transfer = false; t.cat = C.autoCat(S, t); t.catSrc = 'auto'; t.conf = C.lastConf;
  return t;
};
/* ---------- Prüfliste: nur Unsicheres ---------- */
// Gegenseite einer Buchung: IBAN (bei Überweisungen) oder Händlername, getrennt nach Ein- und Ausgang
// Ohne erkennbaren Händler (z. B. „PayPal-Zahlung“) gibt es keinen Schlüssel: jede Zahlung kann etwas anderes sein
C.partyKey = t => {
  const m = t.merchant || '';
  if (/^paypal/i.test(m) || C.isProvider(m)) return null;
  return (t.iban && !t.card && !C.isProvider(t.name) ? 'iban:' + t.iban : 'm:' + C.norm(m || t.name || '')) + (t.amount < 0 ? '-' : '+');
};
C.confirm = (S, t) => { const k = C.partyKey(t); if (!k) return; S.confirmed = S.confirmed || {}; S.confirmed[k] = t.cat; };
C.sureOf = (S, t) => {
  if (t.manual || t.catSrc === 'user' || t.catSrc === 'rule') return true;
  if (t.transfer && (t.cashLink || C.isOwn(S, t))) return true;
  const pk = C.partyKey(t); if (pk && S.confirmed && S.confirmed[pk] === t.cat) return true;
  if (t.rec) { const r = S.recurring.find(x => x.id === t.rec); if (r && r.status === 'aktiv' && r.cat === t.cat) return true; }
  if (t.conf == null && t.catSrc === 'auto' && !t.transfer) { const c = C.autoCat(S, t); t.conf = c === t.cat ? C.lastConf : 'guess'; }
  return t.conf === 'sure';
};
// hakt sichere Buchungen ab; gibt die Anzahl zurück
C.autoReview = S => {
  if (S.settings.autoReview === false) return 0;
  let n = 0; for (const t of S.tx) if (!t.reviewed && C.sureOf(S, t)) { t.reviewed = true; t.autoOk = true; n++; }
  return n;
};
C.reclassifyAll = S => { for (const t of S.tx) C.classify(S, t); C.harmonize(S); };
/* Überweisungen ohne Verwendungszweck: Kategorie von anderen Buchungen derselben IBAN übernehmen */
const WEAK = ['familie', 'einnahmen', 'sonstiges'];
C.harmonize = S => {
  const by = {};
  for (const t of S.tx) if (t.iban && !t.card && !C.isProvider(t.name) && !t.transfer) (by[t.iban + (t.amount < 0 ? '-' : '+')] = by[t.iban + (t.amount < 0 ? '-' : '+')] || []).push(t);
  for (const k in by) {
    const g = by[k]; if (g.length < 3) continue;
    const cnt = {}; for (const t of g) if (!WEAK.includes(t.cat) || t.catSrc !== 'auto') cnt[t.cat] = (cnt[t.cat] || 0) + 1;
    const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
    if (!best || best[1] * 2 <= g.length) continue;
    for (const t of g) if (t.catSrc === 'auto' && WEAK.includes(t.cat)) { t.cat = best[0]; t.catSrc = 'auto'; }
  }
};

/* Import in den Zustand übernehmen */
C.merge = (S, parsed, fileName) => {
  const have = new Set(S.tx.map(t => t.key));
  let added = 0, dup = 0; const newAccs = [];
  for (const a of parsed.accounts) {
    let acc = S.accounts.find(x => x.iban === a.iban);
    if (!acc) {
      const sav = C.SAVINGS_RE.test(a.name || '');
      acc = { id: C.id('a'), iban: a.iban, name: a.name, bank: a.bank, type: sav ? 'savings' : 'giro', inForecast: !sav, color: sav ? '#1f7a4d' : ['#0066b3', '#e8711a', '#1f7a4d', '#7a5fb0'][S.accounts.length % 4] };
      S.accounts.push(acc); newAccs.push(acc.id);
    } else if (acc.type === 'asset' || acc.type === 'cash') {
      // Konto war von Hand angelegt (z. B. Sparkonto aus Vorschlag): ab jetzt kommt der Stand aus der CSV
      acc.type = 'savings'; acc.inForecast = false; acc.bank = acc.bank || a.bank;
    }
  }
  const fresh = [];
  for (const t0 of parsed.txs) {
    if (have.has(t0.key)) { dup++; continue; }
    const t = Object.assign({ id: C.id('t'), reviewed: false, tags: [], note: '' }, t0);
    t.acc = S.accounts.find(a => a.iban === t0.acc).id;
    C.classify(S, t);
    S.tx.push(t); fresh.push(t); added++; have.add(t.key);
  }
  S.tx.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  if (!S.settings.ownName) {
    const own = S.tx.find(t => t.iban && C.sameHolder(t.iban, S.accounts) && t.name);
    if (own) S.settings.ownName = tidyName(own.name);
  }
  C.harmonize(S);
  C.updateBalances(S);
  const recBefore = S.recurring.length;
  C.detectRecurring(S);
  const auto = C.autoReview(S);
  const range = parsed.txs.length ? [parsed.txs.reduce((m, t) => (t.date < m ? t.date : m), '9999'), parsed.txs.reduce((m, t) => (t.date > m ? t.date : m), '0000')] : null;
  S.meta.imports.push({ date: C.today(), file: fileName || '', added, dup, range });
  if (!S.settings.period.auto) C.suggestPeriod(S);
  return { added, dup, newRec: S.recurring.length - recBefore, range, fresh, newAccs, auto, open: fresh.filter(t => !t.reviewed).length };
};

C.SAVINGS_RE = /spar|tagesgeld|festgeld|termingeld|anlagekonto/i;
C.isSaving = a => !!a && (a.type === 'savings' || (a.type === 'asset' && a.sub !== 'depot'));
// Alltagskonten: Girokonten und Bargeld. Nur sie zählen für „frei verfügbar“.
C.spendAcc = (S, id) => { const a = S.accounts.find(x => x.id === id); return !a || a.type === 'giro' || a.type === 'cash'; };
C.potSum = a => (a.pots || []).reduce((s, p) => s + (p.amount || 0), 0);
C.potsInfo = (S, a) => { const sum = C.potSum(a); const bal = C.accBalance(S, a); return { sum, bal, free: bal - sum }; };
C.accGroup = a => (a.type === 'giro' || a.type === 'cash' ? 'alltag' : a.type === 'asset' && a.sub === 'depot' ? 'anlage' : 'sparen');
C.ACC_GROUPS = { alltag: 'Alltag', sparen: 'Sparen', anlage: 'Depot & Anlagen' };
// Konten, an die überwiesen wurde und die erkennbar dir gehören, aber noch fehlen
C.ownCandidates = S => {
  const have = new Set(S.accounts.map(a => a.iban).filter(Boolean)); const m = {};
  for (const t of S.tx) {
    if (!t.iban || have.has(t.iban) || !/^DE\d{20}$/.test(t.iban) || !C.sameHolder(t.iban, S.accounts)) continue;
    const x = m[t.iban] = m[t.iban] || { iban: t.iban, n: 0, out: 0, last: '' };
    x.n++; x.out += -t.amount; if (t.date > x.last) x.last = t.date;
  }
  return Object.values(m).sort((a, b) => b.n - a.n);
};
C.updateBalances = S => {
  for (const a of S.accounts) {
    if (a.type === 'cash') continue;
    if (a.type === 'asset') continue;
    const txs = S.tx.filter(t => t.acc === a.id && t.saldo != null && !t.manual);
    if (!txs.length) continue;
    // neueste Buchung: höchstes Datum; bei gleichem Datum steht in VR-Exporten die neueste oben
    let best = null;
    for (const t of txs) if (!best || t.date > best.date) best = t;
    a.balance = best.saldo; a.balanceDate = best.date;
  }
};
C.accBalance = (S, a) => {
  if (a.type === 'cash') {
    let b = a.start || 0;
    for (const t of S.tx) {
      if (t.acc === a.id) b += t.amount;
      if (t.cashLink && a.id === S.settings.cashAcc) b -= t.amount;
    }
    return b;
  }
  if (a.type === 'asset') {
    if ((a.pots || []).length) return C.potSum(a);
    const h = (a.history || []).slice().sort((x, y) => (x.date < y.date ? -1 : 1)); return h.length ? h[h.length - 1].value : 0;
  }
  let b = a.balance || 0;
  // manuelle Buchungen auf Bankkonten nach dem letzten Saldo zählen mit
  for (const t of S.tx) if (t.acc === a.id && t.manual && (!a.balanceDate || t.date > a.balanceDate)) b += t.amount;
  return b;
};

C.suggestPeriod = S => {
  const sal = S.tx.filter(t => t.cat === 'gehalt' && t.amount > 0).map(t => +t.date.slice(8, 10)).sort((a, b) => a - b);
  if (sal.length) {
    const med = sal[Math.floor((sal.length - 1) / 2)];
    // Stichtag: früheste übliche Gehaltszahlung, damit der Monat mit dem Geld beginnt
    S.settings.period = { mode: 'day', day: Math.max(1, Math.min(28, sal[0] < med - 5 ? med : sal[0])), auto: true };
  }
};

/* ---------- Zeiträume ---------- */
C.periodOf = (S, d) => {
  const p = S.settings.period || { mode: 'month' };
  const [y, m, dd] = parts(d);
  if (p.mode === 'week') {
    const wd = (C.weekday(d) + 6) % 7; const start = C.addDays(d, -wd); const end = C.addDays(start, 6);
    return { start, end, key: start, factor: 12 / 52, label: 'Woche ' + C.fmtDate(start, 'short') + '–' + C.fmtDate(end, 'short') };
  }
  if (p.mode === 'day' && p.day > 1) {
    const N = p.day;
    let sy = y, sm = m;
    if (dd < Math.min(N, dim(y, m))) { sm--; if (sm < 1) { sm = 12; sy--; } }
    const start = iso(sy, sm, Math.min(N, dim(sy, sm)));
    let ey = sy, em = sm + 1; if (em > 12) { em = 1; ey++; }
    const end = C.addDays(iso(ey, em, Math.min(N, dim(ey, em))), -1);
    // Bezeichnung nach dem Monat, in dem die meisten Tage liegen
    const lm = C.diffDays(start, iso(sy, sm, dim(sy, sm))) + 1 >= 15 ? [sy, sm] : [ey, em];
    return { start, end, key: start, factor: 1, label: MON[lm[1] - 1] + ' ' + lm[0], sub: C.fmtDate(start, 'short') + '–' + C.fmtDate(end, 'short') };
  }
  const start = iso(y, m, 1), end = iso(y, m, dim(y, m));
  return { start, end, key: start, factor: 1, label: MON[m - 1] + ' ' + y, sub: '' };
};
C.prevPeriod = (S, p) => C.periodOf(S, C.addDays(p.start, -1));
C.nextPeriod = (S, p) => C.periodOf(S, C.addDays(p.end, 1));
C.periods = (S, n, from) => { const out = []; let p = C.periodOf(S, from || C.today()); for (let i = 0; i < n; i++) { out.unshift(p); p = C.prevPeriod(S, p); } return out; };

/* ---------- Summen ---------- */
C.partsOf = t => {

C.inRange = (S, a, b, f) => S.tx.filter(t => t.date >= a && t.date <= b && (!f || f(t)));
C.counts = t => !t.transfer && !t.excluded;
C.catTotals = (S, a, b, f) => {

/* ---------- Wiederkehrende Zahlungen ---------- */
function median(a) { const s = a.slice().sort((x, y) => x - y); const n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0; }
C.median = median;
C.IV = { w1: { u: 'd', n: 7, label: 'wöchentlich' }, w2: { u: 'd', n: 14, label: 'alle 2 Wochen' }, m1: { u: 'm', n: 1, label: 'monatlich' }, m2: { u: 'm', n: 2, label: 'alle 2 Monate' }, m3: { u: 'm', n: 3, label: 'vierteljährlich' }, m6: { u: 'm', n: 6, label: 'halbjährlich' }, m12: { u: 'm', n: 12, label: 'jährlich' } };

  if (days >= 55 && days <= 66) return 'm2';
  if (days >= 82 && days <= 100) return 'm3';

C.ivDays = iv => (C.IV[iv].u === 'd' ? C.IV[iv].n : C.IV[iv].n * 30.44);
C.nextDate = (r, from) => {

/* Fälligkeiten einer Zahlung im Bereich [a, b] */
C.occurrences = (r, a, b) => {

const RARE_HINTS = [[/rundfunk|beitragsservice/, 'm3', 'rundfunk'], [/bundeskasse|kfz/, 'm12', 'auto']];
C.groupKey = t => {

C.detectRecurring = S => {
  const groups = {};

    const k = C.groupKey(t);

  }
  const found = [];
  for (const k in groups) {
    const g = groups[k].slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    const loose = k.startsWith('m:') || k.startsWith('da:');

    const clusters = [];

      if (c.length < 2) {

        const h = RARE_HINTS.find(([re]) => re.test(hay));

        continue;
      }
      const diffs = []; for (let i = 1; i < c.length; i++) diffs.push(C.diffDays(c[i - 1].date, c[i].date));
      const amts = c.map(x => x.amount); const medA = Math.abs(median(amts)) || 1;
      let changes = 0; for (let i = 1; i < amts.length; i++) if (amts[i] !== amts[i - 1]) changes++;

      if (diffs.some(d => d < 4)) { // mehrere am selben Tag: kein Abo-Muster

C.recMatches = (r, t) => {

  if (r.mkey && C.merchantKey(t) === r.mkey && Math.abs(t.amount - r.amount) <= Math.max(200, Math.abs(r.amount) * 0.15)) return true;

C.activeRec = S => S.recurring.filter(r => r.status !== 'ignoriert' && r.iv);
C.monthly = r => { const I = C.IV[r.iv]; return I.u === 'd' ? Math.round(r.amount * 365.25 / 12 / I.n) : Math.round(r.amount / I.n); };
/* offene (noch nicht gebuchte) Fälligkeiten im Bereich */
C.openDue = (S, a, b, f) => {

/* ---------- Kündigung ---------- */
C.cancelInfo = (r, today) => {
  const c = r.contract || {}; today = today || C.today();

/* ---------- Budgets ---------- */
C.budgetBase = (S, cat, p) => {

  return Math.round((cat.budget || 0) * p.factor);

C.spentIn = (S, catId, a, b) => { const tot = C.catTotals(S, a, b); return -(tot[catId] || 0); };

/* ---------- Sparziele ---------- */
C.goalInfo = (g, today) => {
  today = today || C.today();
  const saved = (g.moves || []).reduce((s, m) => s + m.amount, 0) + (g.start || 0);
  const left = Math.max(0, g.target - saved);

};

/* ---------- Frei verfügbar ---------- */
C.free = (S, p) => {

  const trOpen = -openAll.filter(o => o.r.transfer && o.amount < 0).reduce((s, o) => s + o.amount, 0) - openAll.filter(o => o.r.transfer && o.amount > 0).reduce((s, o) => s + o.amount, 0);

  return { p, income: f.income, incomeOpen, out: f.out, fixOpen, trDone, trOpen, reserves, goals, free, perDay: Math.round(free / daysLeft), daysLeft, flexLeft };
};

/* ---------- Durchschnitt, Lebenshaltung ---------- */
C.fullPeriods = (S, n) => {
  const r = C.dataRange(S); if (!r) return [];
  const out = []; let p = C.prevPeriod(S, C.periodOf(S, C.refDate(S)));
  let guard = 0;
  while (out.length < n && p.start >= r[0] && guard++ < 60) { out.push(p); p = C.prevPeriod(S, p); }
  if (!out.length) { const p0 = C.periodOf(S, r[0]); if (p0.end <= r[1]) out.push(p0); }

};
C.costOfLiving = (S, n) => {

  for (const p of ps) {

  }

};

/* ---------- Prognose ---------- */
C.FLEX_CAP = 25000;
C.flexDaily = S => {
  const r = C.dataRange(S); if (!r) return 0;
  const ref = r[1] < C.refDate(S) ? r[1] : C.refDate(S); const a = C.addDays(ref, -89);
  const from = r[0] > a ? r[0] : a; const days = Math.max(14, C.diffDays(from, ref) + 1);
  let sum = 0;

    // Einzelausgaben über 250 € (Reparatur, Semesterbeitrag …) sind kein Alltag und verzerren den Tagesschnitt
    if (t.date < from || t.date > ref || !C.counts(t) || t.amount >= 0 || t.rec || t.amount < -C.FLEX_CAP) continue;
    const g = C.cat(S, t.cat).group; if (g === 'rare') continue;
    sum += t.amount;
  }
  return Math.round(sum / days);
};
C.forecast = (S, days, scenario) => {
  const accs = S.accounts.filter(a => a.type === 'giro' && a.inForecast !== false);
  const ids = new Set(accs.map(a => a.id));
  let bal = accs.reduce((s, a) => s + C.accBalance(S, a), 0);
  const start = accs.reduce((m, a) => (a.balanceDate && a.balanceDate > m ? a.balanceDate : m), '') || C.refDate(S);
  const end = C.addDays(start, days);
  const due = C.openDue(S, C.addDays(start, 1), end, r => ids.has(r.acc));
  const daily = S.settings.flexInForecast ? C.flexDaily(S) : 0;
  const items = [];
  if (scenario) for (const it of scenario.items || []) {
    if (!it.date) continue;
    if (it.repeat === 'monatlich') { let d = it.date, g = 0; while (d <= end && g++ < 400) { if (d > start) items.push({ date: d, amount: it.amount, label: it.label }); d = C.addMonths(d, 1); } }
    else if (it.date > start && it.date <= end) items.push({ date: it.date, amount: it.amount, label: it.label });
  }
  const out = [{ date: start, balance: bal, events: [] }];
  let min = { date: start, balance: bal };
  for (let i = 1; i <= days; i++) {
    const d = C.addDays(start, i);
    const ev = [];
    for (const o of due) if (o.date === d) { bal += o.amount; ev.push({ label: o.r.name, amount: o.amount, rec: o.r.id }); }
    for (const it of items) if (it.date === d) { bal += it.amount; ev.push({ label: it.label, amount: it.amount, scen: true }); }
    bal += daily;
    out.push({ date: d, balance: bal, events: ev });
    if (bal < min.balance) min = { date: d, balance: bal };

  return { start, days: out, min, daily, endBalance: bal };

C.longTerm = (S, years, monthlyNet, ratePct) => {
  const nw = C.netWorth(S);
  let v = nw; const out = [{ m: 0, v }]; const r = (ratePct || 0) / 100 / 12;
  for (let m = 1; m <= years * 12; m++) { v = v + (v > 0 ? v * r : 0) + monthlyNet; out.push({ m, v: Math.round(v) }); }
  return out;
};

/* ---------- Vermögen ---------- */
C.netWorth = S => S.accounts.filter(a => !a.hidden).reduce((s, a) => s + C.accBalance(S, a), 0);
// Wert laut Verlauf an einem Tag; vor dem ersten Eintrag gilt der erste bekannte Wert
C.valueAt = (hist, d, fallback) => {
  const h = (hist || []).slice().sort((x, y) => (x.date < y.date ? -1 : 1));
  if (!h.length) return fallback;
  let v = h[0].value; for (const x of h) if (x.date <= d) v = x.value;
  return v;
};
C.accBalanceAt = (S, a, d) => {
  if (a.type === 'asset') {
    if ((a.pots || []).length) {
      let v = 0;
      for (const p of a.pots) v += C.valueAt(p.hist, d, p.amount || 0);
      return v;
    }
    return C.valueAt(a.history, d, 0);
  }
  if (a.type === 'cash') { let b = a.start || 0; for (const t of S.tx) { if (t.date > d) continue; if (t.acc === a.id) b += t.amount; if (t.cashLink && a.id === S.settings.cashAcc) b -= t.amount; } return b; }
  const txs = S.tx.filter(t => t.acc === a.id && t.saldo != null && t.date <= d);
  if (!txs.length) { // vor der ersten Buchung: Saldo der ersten Buchung zurückrechnen
    const first = S.tx.filter(t => t.acc === a.id && t.saldo != null).sort((x, y) => (x.date < y.date ? -1 : 1))[0];
    return first ? first.saldo - first.amount : (a.balance || 0);
  }
  let best = txs[0]; for (const t of txs) if (t.date > best.date) best = t;
  let b = best.saldo;
  for (const t of S.tx) if (t.acc === a.id && t.manual && t.date > best.date && t.date <= d) b += t.amount;
  return b;
};
C.monthEnds = S => {
  const r = C.dataRange(S); if (!r) return [];
  const months = []; let [y, m] = parts(r[0]); const [ey, em] = parts(C.refDate(S) > r[1] ? C.refDate(S) : r[1]);
  let g = 0;
  while ((y < ey || (y === ey && m <= em)) && g++ < 240) { months.push(iso(y, m, dim(y, m))); m++; if (m > 12) { m = 1; y++; } }
  // letzter Punkt = heute statt Monatsende in der Zukunft
  const today = C.refDate(S) > r[1] ? C.refDate(S) : r[1];
  if (months.length && months[months.length - 1] > today) months[months.length - 1] = today;
  return months;
};
C.accSeries = (S, a) => C.monthEnds(S).map(d => ({ date: d, value: C.accBalanceAt(S, a, d) }));
C.netWorthSeries = S => C.monthEnds(S).map(d => ({ date: d, value: S.accounts.filter(a => !a.hidden).reduce((v, a) => v + C.accBalanceAt(S, a, d), 0) }));

/* ---------- Händler ---------- */
C.merchants = (S, a, b) => {
  const m = {};
  for (const t of C.inRange(S, a, b, t => C.counts(t) && t.amount < 0)) {
    const k = t.merchant || 'Unbekannt';
    const x = m[k] = m[k] || { name: k, sum: 0, n: 0, last: '', cat: t.cat };
    x.sum += -t.amount; x.n++; if (t.date > x.last) x.last = t.date;
  }
  return Object.values(m).sort((x, y) => y.sum - x.sum);
};

/* ---------- Umverteilung vorschlagen ---------- */
C.rebalance = (S, p) => {
  const ref = C.refDate(S);
  const total = C.diffDays(p.start, p.end) + 1; const gone = Math.min(total, Math.max(1, C.diffDays(p.start, ref) + 1));
  const frac = gone / total;
  const bs = C.budgets(S, p).filter(b => b.cat.group === 'flex' && b.avail > 0);
  const over = bs.filter(b => b.left < 0).sort((x, y) => x.left - y.left);
  const spare = bs.filter(b => b.left > 0).map(b => ({ b, free: Math.max(0, Math.round(b.avail - b.spent / Math.max(frac, 0.1))) })).filter(x => x.free >= 500).sort((x, y) => y.free - x.free);
  const moves = [];
  for (const o of over) {
    let need = -o.left;
    for (const s of spare) {
      if (need <= 0) break;
      const amt = Math.min(need, s.free, s.b.left);
      if (amt < 100) continue;
      const rounded = Math.ceil(amt / 500) * 500 <= s.b.left ? Math.ceil(amt / 500) * 500 : amt;
      moves.push({ from: s.b.cat.id, to: o.cat.id, amount: rounded });
      s.free -= rounded; s.b.left -= rounded; need -= rounded;
    }
  }
  return moves;
};
C.applyMoves = (S, p, moves) => {
  const plan = S.plan[p.key] = S.plan[p.key] || {};
  for (const mv of moves) {
    for (const [id, d] of [[mv.from, -mv.amount], [mv.to, mv.amount]]) {
      const c = C.cat(S, id); const base = plan[id] != null ? plan[id] : C.budgetBase(S, c, p);
      plan[id] = Math.max(0, base + d);
    }
  }
};

/* ---------- Plan (jeder Euro eine Aufgabe) ---------- */
C.planInfo = (S, p) => {
  const col = C.costOfLiving(S, 3);
  const f = C.flows(S, p.start, p.end);
  const incOpen = C.openDue(S, p.start, p.end, r => !r.transfer && r.amount > 0).reduce((s, o) => s + o.amount, 0);
  const expected = Math.max(f.income + incOpen, col ? col.income : 0);
  const income = S.plan[p.key] && S.plan[p.key].__income != null ? S.plan[p.key].__income : expected;
  let assigned = 0; const rows = [];
  for (const c of S.cats) {
    if (c.group === 'income' || c.group === 'transfer') continue;
    let v = C.budgetBase(S, c, p);
    if (!v && c.group === 'fix') v = -C.openDue(S, p.start, p.end, r => r.cat === c.id && !r.transfer).reduce((s, o) => s + o.amount, 0) + C.spentIn(S, c.id, p.start, p.end);
    rows.push({ cat: c, value: v }); assigned += v;
  }
  const goals = S.goals.filter(g => !g.archived).reduce((s, g) => s + C.goalInfo(g).rate, 0);
  const savingsRec = -C.activeRec(S).filter(r => r.transfer && r.amount < 0).reduce((s, r) => s + C.monthly(r), 0);
  return { income, expected, assigned, goals, savingsRec, left: income - assigned - goals - savingsRec, rows };
};

/* ---------- Hinweise ---------- */
C.notices = S => {
  const out = []; const ref = C.refDate(S); const today = C.today();
  const add = (id, level, text, go) => { if (S.dismissed[id]) return; out.push({ id, level, text, go }); };
  const nrev = S.tx.filter(t => !t.reviewed).length;
  if (nrev) add('rev:' + nrev, 'info', nrev + (nrev === 1 ? ' neue Buchung wartet' : ' neue Buchungen warten') + ' auf deine Prüfung.', 'review');
  const r = C.dataRange(S);
  if (r && C.diffDays(r[1], today) > 14) add('stale:' + r[1], 'info', 'Deine letzte Buchung ist vom ' + C.fmtDate(r[1]) + '. Lade eine neue CSV hoch, damit alles aktuell ist.', 'import');
  const p = C.periodOf(S, ref);
  for (const b of C.budgets(S, p)) {
    if (!b.avail || b.auto) continue;
    if (b.pct >= 1) add('over:' + p.key + ':' + b.cat.id, 'warn', b.cat.emoji + ' ' + b.cat.name + ': Budget um ' + C.fmt(-(b.left)) + ' überschritten.', 'budget');
    else if (b.pct >= 0.9) add('near:' + p.key + ':' + b.cat.id, 'info', b.cat.emoji + ' ' + b.cat.name + ': ' + Math.round(b.pct * 100) + ' % vom Budget verbraucht.', 'budget');
  }
  for (const o of C.openDue(S, today, C.addDays(today, 3), x => !x.transfer && x.amount < 0)) add('due:' + o.r.id + ':' + o.date, 'info', o.r.name + ' bucht am ' + C.fmtDate(o.date, 'short') + ' ' + C.fmt(-o.amount) + ' ab.', 'rec:' + o.r.id);
  for (const x of S.recurring) {
    if (x.status === 'ignoriert') continue;
    const ci = C.cancelInfo(x, today);
    if (ci && ci.daysLeft >= 0 && ci.daysLeft <= (x.contract.remind || S.settings.remindDays || 30)) add('cancel:' + x.id + ':' + ci.deadline, 'warn', 'Kündigungsfrist ' + x.name + ': noch ' + ci.daysLeft + (ci.daysLeft === 1 ? ' Tag' : ' Tage') + ' (bis ' + C.fmtDate(ci.deadline) + ').', 'rec:' + x.id);
    if (x.priceChange && C.diffDays(x.priceChange.date, today) <= 60) add('price:' + x.id + ':' + x.priceChange.date, 'warn', x.name + ' kostet jetzt ' + C.fmt(-x.priceChange.to) + ' statt ' + C.fmt(-x.priceChange.from) + '.', 'rec:' + x.id);
  }
  const nNew = S.recurring.filter(x => x.status === 'neu').length;
  if (nNew) add('recnew:' + nNew, 'info', nNew + (nNew === 1 ? ' Vertrag oder Abo neu erkannt.' : ' Verträge und Abos neu erkannt.') + ' Kurz bestätigen?', 'contracts');
  if (S.accounts.some(a => a.type === 'giro')) {
    const fc = C.forecast(S, 30);
    if (fc.min.balance < (S.settings.lowBalance || 0)) add('low:' + fc.min.date, 'warn', 'Prognose: Am ' + C.fmtDate(fc.min.date, 'short') + ' liegt dein Kontostand bei nur ' + C.fmt(fc.min.balance) + '.', 'forecast');
  }
  for (const g of S.goals) { const gi = C.goalInfo(g, today); if (gi.done && !g.archived) add('goal:' + g.id, 'ok', 'Sparziel „' + g.name + '“ erreicht. 🎉', 'goals'); }
  if (S.tx.length && (!S.settings.lastBackup || C.diffDays(S.settings.lastBackup, today) > 30)) add('backup:' + (S.settings.lastBackup || 'nie'), 'info', S.settings.lastBackup ? 'Dein letztes Backup ist über 30 Tage alt.' : 'Du hast noch kein Backup gemacht.', 'backup');
  return out;
};

/* ---------- Monatsrückblick ---------- */
C.review = (S, p) => {
  const f = C.flows(S, p.start, p.end);
  const prev = C.fullPeriods(S, 6).filter(q => q.start < p.start).slice(0, 3);
  const avgOut = prev.length ? Math.round(prev.reduce((s, q) => s + C.flows(S, q.start, q.end).out, 0) / prev.length) : null;
  const cats = Object.entries(f.tot).filter(([id]) => { const g = C.cat(S, id).group; return g !== 'income' && g !== 'transfer'; }).map(([id, v]) => ({ cat: C.cat(S, id), v: -v })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const changes = [];
  if (prev.length) {
    for (const c of S.cats) {
      if (c.group === 'income' || c.group === 'transfer') continue;
      const now = -(f.tot[c.id] || 0);
      const avg = Math.round(prev.reduce((s, q) => s - (C.catTotals(S, q.start, q.end)[c.id] || 0), 0) / prev.length);
      if (Math.abs(now - avg) >= 2000 && (avg === 0 || Math.abs(now - avg) / Math.max(avg, 1) >= 0.25)) changes.push({ cat: c, now, avg, d: now - avg });
    }
    changes.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  }
  const newRec = S.recurring.filter(r => r.created >= p.start && r.created <= C.addDays(p.end, 40) && r.status !== 'ignoriert' && r.count <= 2);
  const biggest = C.inRange(S, p.start, p.end, t => C.counts(t) && t.amount < 0).sort((a, b) => a.amount - b.amount).slice(0, 3);
  const rate = f.income > 0 ? (f.income - f.out) / f.income : null;
  return { p, f, avgOut, cats, changes: changes.slice(0, 4), newRec, biggest, rate };
};

/* Belege in IndexedDB */
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open('zoes-finanzen', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('belege');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },

function txFiltered() {
  const F = U.tx; const p = period();
  const q = C.norm(F.q);
  return S.tx.filter(t => {
    if (F.range === 'p' && (t.date < p.start || t.date > p.end)) return false;
    if (F.cat && !(t.cat === F.cat || (t.splits || []).some(s => s.cat === F.cat))) return false;
    if (F.acc && t.acc !== F.acc) return false;
    if (F.merchant && t.merchant !== F.merchant) return false;
    if (F.kind === 'out' && (t.amount >= 0 || t.transfer)) return false;
    if (F.kind === 'in' && (t.amount <= 0 || t.transfer)) return false;
    if (F.kind === 'tr' && !t.transfer) return false;
    if (F.tag && !(t.tags || []).includes(F.tag)) return false;
    if (F.flag === 'open' && t.reviewed) return false;
    if (F.flag === 'tax' && !t.tax) return false;
    if (F.flag === 'receipt' && !t.receipt) return false;
    if (F.flag === 'note' && !t.note) return false;
    if (F.flag === 'manual' && !t.manual) return false;
    if (F.flag === 'excl' && !t.excluded) return false;
    if (q) { const hay = C.norm(t.merchant + ' ' + t.name + ' ' + t.purpose + ' ' + (t.note || '') + ' ' + (t.tags || []).join(' ') + ' ' + catOf(t.cat).name + ' ' + C.fmtPlain(Math.abs(t.amount))); if (!q.split(' ').every(w => hay.includes(w))) return false; }
    return true;
  });
}
function txRow(t) {
  const c = catOf(t.cat); const acc = S.accounts.length > 1 ? accOf(t.acc) : null;
  const flags = (t.splits && t.splits.length ? ' · aufgeteilt' : '') + (t.receipt ? ' · 📎' : '') + (t.note ? ' · 📝' : '') + (t.tax ? ' · Steuer' : '') + (t.rec ? ' · 🔁' : '');
  return '<button class="li" data-act="txSheet" data-arg="' + t.id + '">' + catIc(c) + '<div class="mid"><div class="t1">' + esc(t.merchant) + (t.reviewed ? '' : ' <span class="dot" style="background:var(--accent);vertical-align:middle" title="ungeprüft"></span>') + '</div><div class="t2">' + esc(c.name) + (t.transfer && c.id !== 'umbuchung' ? ' · Umbuchung' : '') + (t.excluded ? ' · nicht gezählt' : '') + flags + (acc ? ' · ' + esc(acc.name) : '') + '</div></div><div class="end">' + money(t.amount, { sign: true, cls: t.transfer || t.excluded ? 'faint' : t.amount > 0 ? 'pos' : '' }) + '</div></button>';
}

  const accs = S.accounts.filter(a => S.tx.some(t => t.acc === a.id));

  if (!list.length) return h + '<div class="card empty"><div class="e-ic">🔍</div>Keine Buchungen gefunden.' + (S.tx.length ? '' : '<div class="mt16"><button class="btn primary" data-act="openImport">CSV importieren</button></div>') + '</div>';
  const lim = U.txLimit || 200; let cur = ''; let block = ''; let out = '';
  const flush = () => { if (block) out += '<div class="card tx-card list">' + block + '</div>'; block = ''; };
  const dayTot = {}; for (const t of list) if (C.counts(t)) dayTot[t.date] = (dayTot[t.date] || 0) + t.amount;
  list.slice(0, lim).forEach(t => {

    block += txRow(t);

  if (list.length > lim) out += '<button class="btn block mt8" data-act="txMore">Weitere ' + Math.min(200, list.length - lim) + ' anzeigen</button>';
  return h + out;
};

    try { const txt = decodeText(await readFile(f)); res.push(Object.assign({ file: f.name }, importText(txt, f.name))); } catch (e) { res.push({ file: f.name, err: e.message }); }

  el.value = '';
  U.lastImport = '<div class="card" style="border-left:4px solid var(--pos)">' + res.map(r => r.err ? '<p class="neg mt0"><b>' + esc(r.file) + '</b>: ' + esc(r.err) + '</p>' : '<h2 class="mb8">' + I('check', '') + ' ' + plural(r.added, 'neue Buchung', 'neue Buchungen') + '</h2><p class="small muted mt0">' + esc(r.file) + (r.range ? ' · ' + fmtD(r.range[0]) + ' bis ' + fmtD(r.range[1]) : '') + (r.dup ? ' · ' + r.dup + ' schon vorhanden' : '') + (r.added ? ' · ' + (r.open ? r.open + ' zum Prüfen, der Rest ist eindeutig zugeordnet' : 'alle eindeutig zugeordnet') : '') + (r.newRec ? ' · ' + plural(r.newRec, 'Vertrag', 'Verträge') + ' neu erkannt' : '') + (r.merged ? ' · ' + r.merged + ' von Hand erfasste Buchungen zusammengeführt' : '') + '</p>').join('') +
    '<div class="row-btns">' + (S.tx.some(t => !t.reviewed) ? '<button class="btn small primary" data-act="startReview">Buchungen prüfen</button>' : '') + (S.recurring.some(r => r.status === 'neu') ? '<button class="btn small" data-act="go" data-arg="rec">Verträge ansehen</button>' : '') + '<button class="btn small" data-act="go" data-arg="start">Zur Übersicht</button></div></div>';

};
function importText(txt, name) {
  const parsed = C.importCSV(txt, { fileName: name });
  if (!parsed.txs.length) throw new Error('In der Datei stehen keine Buchungen.');
  if (S.meta.demo) { const keep = S.settings; S = C.newState(); S.settings = Object.assign(keep, { onboarded: true, ownName: '', ownIbans: [], period: { mode: 'day', day: 1 } }); toast('Beispieldaten entfernt'); }
  const r = C.merge(S, parsed, name);
  // von Hand erfasste Buchungen mit der Bank-Buchung zusammenführen
  let merged = 0;
  for (const t of r.fresh) {
    const m = S.tx.find(x => x.manual && x.acc === t.acc && x.amount === t.amount && Math.abs(C.diffDays(x.date, t.date)) <= 4);
    if (!m) continue;
    t.cat = m.cat; t.catSrc = 'user'; t.note = m.note || t.note; t.tags = m.tags || []; t.tax = m.tax; t.splits = m.splits; t.reviewed = true;
    if (m.receipt) { DB.get(m.id).then(d => { if (d) { DB.put(t.id, d); DB.del(m.id); } }).catch(() => {}); t.receipt = true; }
    S.tx = S.tx.filter(x => x !== m); merged++;
  }
  if (merged) C.detectRecurring(S);
  save(true);
  return Object.assign(r, { merged });
}

  S.settings.onboarded = true; S.meta.demo = true; S.meta.realName = keepName;
  // ein paar Beispiele für Budgets, Ziele und Szenarien
  for (const [id, v] of [['lebensmittel', 25000], ['essen', 8000], ['mobilitaet', 12000], ['drogerie', 4000], ['online', 6000]]) C.cat(S, id).budget = v;
  C.cat(S, 'reisen').budget = 90000; C.cat(S, 'geschenke').budget = 30000;
  S.goals.push({ id: uid('g'), name: 'Urlaub Portugal', emoji: '🏖️', target: 120000, deadline: C.addMonths(C.today(), 8), start: 30000, rate: 0, moves: [{ id: uid('m'), date: C.today(), amount: 15000 }] });
  S.scenarios.push({ id: uid('s'), name: 'Neues Handy', items: [{ label: 'Smartphone', amount: -79900, date: C.addDays(C.today(), 20), repeat: '' }] });
  save(true); U.view = 'start'; render(); toast('Beispieldaten geladen. Du kannst alles ausprobieren.');
};
A.leaveDemo = () => confirmSheet('Eigene Daten laden?', 'Die Beispieldaten werden gelöscht. Danach lädst du deine CSV.', 'Weiter', () => { const n = S.meta.realName || ''; S = C.newState(); S.settings.ownName = n; save(true); render(); });
let pinBuf = '';
function lockScreen() {
  return '<div class="center-screen"><div style="font-size:2rem">🔒</div><h1 style="color:#fff;margin-top:8px">Zoes Finanzen</h1><p style="opacity:.85">PIN eingeben</p><div class="pin-dots" id="pin-dots">' + [0, 1, 2, 3, 4, 5].slice(0, S.settings.pinLen || Math.max(4, pinBuf.length)).map(i => '<i class="' + (i < pinBuf.length ? 'on' : '') + '"></i>').join('') + '</div><div class="pinpad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? '<span></span>' : '<button data-act="pin" data-arg="' + k + '" aria-label="' + (k === '⌫' ? 'Löschen' : k) + '">' + k + '</button>').join('') + '</div></div>';
}
A.pin = async k => {
  if (k === '⌫') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 6) pinBuf += k;
  render();
  if (pinBuf.length >= 4) {
    const h = await hashPin(pinBuf);
    if (h === S.settings.pin) { pinBuf = ''; U.locked = false; render(); return; }
    if (pinBuf.length >= (S.settings.pinLen || 6)) { const d = $('#pin-dots'); if (d) d.classList.add('shake'); pinBuf = ''; setTimeout(render, 400); }
  }
};
document.addEventListener('keydown', e => { if (U.locked && S.settings.pin) { if (/^\d$/.test(e.key)) A.pin(e.key); else if (e.key === 'Backspace') A.pin('⌫'); } });

/* ---------- Ereignisse ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.arg, el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (!el) return; const fn = CH[el.dataset.ch]; if (fn) fn(el.dataset.arg, el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (!el) return; const fn = CH[el.dataset.in]; if (fn) fn(el.dataset.arg, el, e); });
window.addEventListener('error', e => { console.error(e.error || e.message); });

/* ---------- Start ---------- */
function boot() {
  loadState();
  if (S.settings.pin) U.locked = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* */ }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme());
  render();
}

boot();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
